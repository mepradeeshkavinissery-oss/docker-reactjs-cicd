name: React CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify checked out commit and source
        run: |
          echo "GitHub SHA: $GITHUB_SHA"
          git rev-parse HEAD
          echo "App.js:"
          sed -n '1,10p' src/App.js
          echo "MainContainer:"
          grep -n "Object.keys" src/components/main-container.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 9.6.1

      - name: Install dependencies
        run: npm install

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Verify source before build
        run: |
          echo "=== APP.JS BEFORE BUILD ==="
          sed -n '1,10p' src/App.js
          echo "=== MAIN-CONTAINER.JS BEFORE BUILD ==="
          grep -n "Object.keys" src/components/main-container.js
          echo "=== GIT COMMIT ==="
          git rev-parse HEAD

      - name: Build React application
        run: unset CI && npm run build

      - name: Build Docker image
        run: docker build -t docker-reactjs:${{ github.sha }} .
