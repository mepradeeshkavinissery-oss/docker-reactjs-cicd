name: React CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify checked out commit and source
        run: |
          echo "GitHub SHA: $GITHUB_SHA"
          git rev-parse HEAD

          echo "App.js:"
          sed -n '1,10p' src/App.js

          echo "MainContainer:"
          grep -n "Object.keys" src/components/main-container.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 9.6.1

      - name: Install dependencies
        run: npm install

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Verify source before build
        run: |
          echo "=== APP.JS BEFORE BUILD ==="
          sed -n '1,10p' src/App.js

          echo "=== MAIN-CONTAINER.JS BEFORE BUILD ==="
          grep -n "Object.keys" src/components/main-container.js

          echo "=== GIT COMMIT ==="
          git rev-parse HEAD

      - name: Build React application
        run: unset CI && npm run build

      - name: Build Docker image
        run: |
          docker build \
            -t docker-reactjs:${{ github.sha }} \
            .

      - name: Configure Docker for Nexus HTTP registry
        run: |
          echo '{
            "insecure-registries": [
              "${{ secrets.NEXUS_REGISTRY }}"
            ]
          }' | sudo tee /etc/docker/daemon.json

          sudo systemctl restart docker

          echo "=== Docker Insecure Registry Configuration ==="
          docker info | grep -A5 -i "Insecure Registries"

      - name: Login to Nexus
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | \
          docker login "${{ secrets.NEXUS_REGISTRY }}" \
            --username "${{ secrets.NEXUS_USERNAME }}" \
            --password-stdin

      - name: Tag Docker image for Nexus
        run: |
          docker tag \
            docker-reactjs:${{ github.sha }} \
            ${{ secrets.NEXUS_REGISTRY }}/docker-reactjs:${{ github.sha }}

      - name: Push Docker image to Nexus
        run: |
          docker push \
            ${{ secrets.NEXUS_REGISTRY }}/docker-reactjs:${{ github.sha }}

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Tag Docker image for Docker Hub
        run: |
          docker tag \
            docker-reactjs:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-reactjs:${{ github.sha }}

      - name: Push Docker image to Docker Hub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-reactjs:${{ github.sha }}
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/docker-reactjs
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d
            docker compose ps
